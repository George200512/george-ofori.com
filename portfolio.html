<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Collection of my works and collaboration" />
  <meta name="keywords" content="My works, collaboration" />
  <meta name="revised" content="14th-Dec-2025">
  <meta name="robots" content="index, follow">
  <title>Portfolio</title>
  <link rel="stylesheet" href="styles/all.min.css" />
  <link rel="stylesheet" href="styles/index.css" />
  <link rel="stylesheet" href="styles/portfolio.css" />
  <link rel="icon" type="image/x-icon" href="images/favicon/favicon.ico" />
  <script src="scripts/jquery-3.7.1.min.js"></script>
  <script src="scripts/email.min.js"></script>
  <script src="scripts/index.js" defer="true"></script>
  <script src="scripts/form.js" defer="true" type="module"></script>
</head>
<body>
  <header>
    
    <div class="heading-1">
    <div class="container-1">
      <a href="javascript:history.back()" class="prev-button"><span class="fa-solid fa-arrow-left"></span></a>
      <p class="prev-label">Portfolio</p>
    </div>
      
      <div class="buttons">        
      <div class="hire-button">Hire me</div>    
      </div>
    </div>
        
         <div class="heading-2">
           <div class="overlay">
            <form class="hire-form" autocomplete method="post">
          <p class="instruction">Send Me An Email</p>
              
              <div class="close-button">
              <span class="fa-solid fa-xmark close-form-button"></span>
              </div>
            
            <label for="username">Name</label>
              <div class="input">
                <span class="fa-solid fa-user"></span> 
                <input type="text" placeholder="Username" id="username" required/>
              </div>
              
              <label for="email">Email</label>
              <div class="input">
                <span class="fa-solid fa-envelope"></span> 
                <input type="email" placeholder="Email" id="email" required/>
              </div>
              
              <label for="message">Message</label>
              <div class="input">
                <span class="fa-solid fa-message"></span> 
                <textarea id="message" rows="6"></textarea>
              </div>
              
              <input type="submit" value="Send" id="sendButton" />
        </form>  
           </div>             
  </header>
    
    <main>
      <div class="email-status">
        <div class="status-content">
          <span class="fa-solid  status-icon"></span>
          <p class="status"></p>
        </div>
        
        <div class="status-buttons">
          <button class="ok">Ok</button>
          <button class="close">Close</button>
          <button class="retry"><i class="fa-solid fa-redo"></i></button>
        </div>
      </div>
      
      <section class="projects">
        <h1 class="heading">My works</h1>
        <div class="projects-container">
          
        <div class="project-item">
          <div class="header">
            <p class="title">Street Python</p>
            <a href="https://george-ofori.vercel.app" class="domain"><span class="fa-solid fa-link"></span> https://george-ofori.vercel.app</a>
          </div>
          
          <div class="content">
            <p class="description">A Ghanaian front end web developer that designs professional websites for companies.</p>
            <img src="images/completed_projects_images/street-python-icon.png" alt="https://george-ofori.vercel.app" class="favicon"/>
          </div>
        </div>
          
          
        </div>
        </div>
      </section>
    </main>
    
    <footer>
      
    </footer>
</body>
</html>
