<!DOCTYPE html>

<html>
<head>
  <meta http-equiv="CONTENT-TYPE" content="text/html; charset=UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="My profile goals, missions and vision" />
  <meta name="keywords" content="Vision, Goal, aspiration" />
  <meta name="revised" content="2nd-Dec-2025">
  <meta name="robots" content="index, follow">
  <title>About</title>
  <link rel="stylesheet" href="styles/all.min.css" />
  <link rel="stylesheet" href="styles/index.css" />
  <link rel="stylesheet" href="styles/about.css" />
  <link rel="icon" type="image/x-icon" href="images/favicon/favicon.ico" />
  <script src="scripts/jquery-3.7.1.min.js"></script>
  <script src="scripts/email.min.js"></script>
  <script src="scripts/index.js" defer="true"></script>
  <script src="scripts/form.js" defer="true" type="module"></script>
</head>
<body>
  <header>
    
    <div class="heading-1">
    <div class="container-1">
      <a href="javascript:history.back()" class="prev-button"><span class="fa-solid fa-arrow-left"></span></a>
      <p class="prev-label">About</p>
    </div>
      
      <div class="buttons">        
      <div class="hire-button">Hire me</div>    
      </div>
    </div>
        
         <div class="heading-2">
            <form class="hire-form" autocomplete method="post">
          <p class="instruction">Send Me An Email</p>
              
              <div class="close-button">
              <span class="fa-solid fa-xmark close-form-button"></span>
              </div>
            
            <label for="username">Name</label>
              <div class="input">
                <span class="fa-solid fa-user"></span> 
                <input type="text" placeholder="Username" id="username" required/>
              </div>
              
              <label for="email">Email</label>
              <div class="input">
                <span class="fa-solid fa-envelope"></span> 
                <input type="email" placeholder="Email" id="email" required/>
              </div>
              
              <label for="message">Message</label>
              <div class="input">
                <span class="fa-solid fa-message"></span> 
                <textarea id="message" rows="6"></textarea>
              </div>
              
              <input type="submit" value="Send" id="sendButton" />
        </form>           
  </header>
    
    <main>
      <section class="section-1">
        
        <img src="images/5376728.jpg" class="background" alt="Backgroung image" />
        
        <div class="content">
        <div class="header">
        <h1 class="heading">About<span class="me"> Me</span></h1>
        </div>
        
        <p class="description">
          I design responsive, interactive and use friendly websites.<br />
          I make your old websites new and new ones futuristic.
        </p>
        </div>
        
      </section>
    </main>
    
    <footer>
      
    </footer>
</body>
</html>
